<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 118" role="img" aria-label="Logo placeholder">
  <!-- Neutral placeholder. Used only as a CSS mask (see layout/footer.css),
       read by alpha, not color — the rect's own fill never shows. The
       internal luminance mask below punches "LOGO"-shaped holes through the
       rect, so the result reads as an outlined wordmark instead of a solid
       bar. Replace with the real stacked wordmark. -->
  <mask id="logo-stacked-cutout">
    <rect x="0" y="0" width="336" height="118" fill="#fff"/>
    <text x="20" y="72" font-family="sans-serif" font-size="46" font-weight="700" fill="#000">LOGO</text>
  </mask>
  <rect x="0" y="20" width="336" height="78" fill="#000" mask="url(#logo-stacked-cutout)"/>
</svg>
