<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 127" role="img" aria-label="Logo placeholder">
  <!-- Neutral placeholder. Used only as a CSS mask (see examples/css/layout/header.css
       and footer.css), read by alpha, not color — the rect's own fill
       never shows. The internal luminance mask below punches "LOGO"-shaped
       holes through the rect, so the result reads as an outlined wordmark
       instead of a solid bar. Replace with the real horizontal wordmark. -->
  <mask id="logo-cutout">
    <rect x="0" y="0" width="1366" height="127" fill="#fff"/>
    <text x="40" y="86" font-family="sans-serif" font-size="60" font-weight="700" fill="#000">LOGO</text>
  </mask>
  <rect x="0" y="30" width="500" height="67" fill="#000" mask="url(#logo-cutout)"/>
</svg>
